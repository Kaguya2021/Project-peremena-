<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>PEREMENA — физкультура 9-В</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div><div class="brand">📍 PEREMENA</div><div class="sub">№104 ЖББ мектеби • 9-В класс</div></div>
  <button class="icon" id="theme" data-act="theme" aria-label="Сменить тему">
    <svg id="themeSvg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path id="themePath" />
    </svg>
  </button>
</header>
<main id="view"></main>
<nav>
  <button data-act="nav" data-v="home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Главная</span>
  </button>
  <button data-act="nav" data-v="lesson">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span>Занятие</span>
  </button>
  <button data-act="nav" data-v="history">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    <span>История</span>
  </button>
  <button data-act="nav" data-v="students">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Ученики</span>
  </button>
  <button data-act="nav" data-v="stats">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    <span>Статистика</span>
  </button>
</nav>
<div id="sheet"></div>
<div id="toasts"></div>
<noscript>Для работы PEREMENA нужен JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
